<!DOCTYPE html>
<html lang="bn">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#0F0F0F">

    <title>LIVE STREAM</title>

    <link rel="stylesheet"
          href="style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- HLS.js -->
  
</head>

<body>

<header class="main-header">

<div class="logo-area">

    <img src="assests/logo/live-stream-logo.png" alt="Live Stream" class="app-logo">

    <div class="logo-text">
        <h2>LIVE STREAM</h2>
        <span>Watch Live Anytime</span>
    </div>

</div>

    <div class="header-actions">

        <button class="icon-btn" id="searchBtn">

            <i class="fa-solid fa-magnifying-glass"></i>

        </button>

        <button class="icon-btn" id="menuBtn">

            <i class="fa-solid fa-bars"></i>

        </button>

    </div>

</header>

<main class="viewer-layout">

<section class="player-section">

<div class="video-box" id="videoContainer">

<video
id="videoPlayer"
autoplay
muted
playsinline>
</video>

<iframe
id="youtubePlayer"
style="display:none;border:none;"
allow="autoplay;fullscreen"
allowfullscreen>
</iframe>

<div class="video-overlay"
id="videoOverlay">

<i class="fa-solid fa-spinner fa-spin"></i>

<p>সম্প্রচার লোড হচ্ছে...</p>

</div>
<div class="video-watermark">
<img src="assests/logo/live-stream-logo.png" alt="Live Stream">
</div>

<div class="custom-controls">

<button id="playPauseBtn">

<i class="fa-solid fa-play"></i>

</button>

<button id="muteBtn">

<i class="fa-solid fa-volume-high"></i>

</button>

<input
type="range"
id="seekBar"
value="0"
min="0"
max="100">

<button id="pipBtn">

<i class="fa-regular fa-clone"></i>

</button>

<button id="fullscreenBtn">

<i class="fa-solid fa-expand"></i>
</button>
</div>
</div>
<!-- ========================= -->
<!-- Stream Information -->
<!-- ========================= -->

<div class="stream-info" id="streamInfoOverlay">

    <div class="live-status">

        <span class="live-dot"></span>

        <span class="live-text">LIVE</span>

    </div>

    <h2 id="displayTitle">

        লাইভ টাইটেল

    </h2>

    <p id="displayDesc">

        এখানে লাইভ স্ট্রিমের বিবরণ দেখানো হবে।

    </p>

</div>

<!-- ========================= -->
<!-- Action Buttons -->
<!-- ========================= -->

<div class="action-bar">

    <button
        id="likeBtn"
        class="action-btn">

        <i class="fa-solid fa-heart"></i>

        <span id="likeCount">

            0

        </span>

    </button>

    <button
        id="shareBtn"
        class="action-btn">

        <i class="fa-solid fa-share-nodes"></i>

        <span>

            Share

        </span>

    </button>

    <div class="viewer-counter">

        <i class="fa-solid fa-eye"></i>

        <span id="viewerCount">

            0 Watching

        </span>

    </div>

</div>

<!-- ========================= -->
<!-- Live Channels -->
<!-- ========================= -->

<section class="channel-section">

    <div class="section-title">

        <i class="fa-solid fa-tv"></i>

        <h3>

            Live Channels

        </h3>

    </div>

    <div
        id="channelList"
        class="channel-list">

        <!-- JavaScript থেকে Channel Card যুক্ত হবে -->

    </div>

</section>
<!-- ========================= -->
<!-- Live Chat -->
<!-- ========================= -->

<section class="chat-section">

    <div class="section-title">

        <i class="fa-solid fa-comments"></i>

        <h3>Live Chat</h3>

    </div>

    <div
        class="chat-box"
        id="chatBox">

        <div class="chat-message">

            <b>সিস্টেম:</b>

            লাইভ স্ট্রিমে স্বাগতম!

        </div>

    </div>

    <div class="chat-input-row">

        <input
            type="text"
            id="commentInput"
            placeholder="একটি মন্তব্য লিখুন...">

        <button
            id="sendCommentBtn">

            <i class="fa-solid fa-paper-plane"></i>

        </button>

    </div>

</section>

</section>

</main>
<div id="offlineScreen" class="offline-screen" style="display:none;">
<img src="assests/logo/live-stream-logo.png" alt="Offline">
</div>

<div id="loadingScreen" class="loading-screen">
<img src="assests/logo/live-stream-logo.png" alt="Live Stream">
</div>

<!-- Scripts -->
<!-- ========================= -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script type="module" src="app.js"></script>

</body>
        </html>
